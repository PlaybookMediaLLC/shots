name: Founder Hub paired integration

on:
  pull_request:
    branches: [develop]
    paths:
      - 'server/**'
      - 'clients/apps/web/components/settings/FounderHubSettings.tsx'
      - 'clients/apps/web/components/settings/founder-hub/**'
      - 'clients/apps/web/app/api/founder-hub/**'
      - 'clients/apps/web/app/**/founder-hub/manage/**'
      - 'clients/apps/web/app/api/auth/**'
      - 'clients/apps/web/app/.well-known/**'
      - 'clients/apps/web/lib/auth/**'
      - 'clients/apps/web/lib/api/contracts/founder-hub*.ts'
      - 'clients/apps/web/test/e2e/founder-hub-settings.spec.ts'
      - 'clients/apps/web/test/e2e/founder-hub-auth.spec.ts'
      - 'clients/apps/web/test/founder-hub-oauth.paired.ts'
      - 'clients/packages/screenshot-studio-backend-sdk/src/founder-hub-*.ts'
      - 'clients/apps/web/package.json'
      - 'clients/package.json'
      - 'clients/package-lock.json'
      - 'dev/**'
      - '.github/workflows/founder-hub-integration.yml'
  push:
    branches: [develop]
    paths:
      - 'server/**'
      - 'clients/apps/web/components/settings/FounderHubSettings.tsx'
      - 'clients/apps/web/components/settings/founder-hub/**'
      - 'clients/apps/web/app/api/founder-hub/**'
      - 'clients/apps/web/app/**/founder-hub/manage/**'
      - 'clients/apps/web/app/api/auth/**'
      - 'clients/apps/web/app/.well-known/**'
      - 'clients/apps/web/lib/auth/**'
      - 'clients/apps/web/lib/api/contracts/founder-hub*.ts'
      - 'clients/apps/web/test/e2e/founder-hub-settings.spec.ts'
      - 'clients/apps/web/test/e2e/founder-hub-auth.spec.ts'
      - 'clients/apps/web/test/founder-hub-oauth.paired.ts'
      - 'clients/packages/screenshot-studio-backend-sdk/src/founder-hub-*.ts'
      - 'clients/apps/web/package.json'
      - 'clients/package.json'
      - 'clients/package-lock.json'
      - 'dev/**'
      - '.github/workflows/founder-hub-integration.yml'
  workflow_dispatch:
    inputs:
      counterpart_ref:
        description: Branch or tag to test from shots-founder-hub-central-auth
        required: false
        default: develop

permissions:
  contents: read

concurrency:
  group: founder-hub-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: shots-founder-hub-central-auth
    steps:
      - uses: actions/checkout@v4
        with:
          path: shots-founder-hub-backend
      - uses: actions/checkout@v4
        with:
          repository: PlaybookMediaLLC/shots-founder-hub
          ref: ${{ inputs.counterpart_ref || 'fix/shots-central-auth' }}
          path: shots-founder-hub-central-auth
      - uses: actions/setup-go@v5
        with:
          go-version-file: shots-founder-hub-backend/server/go.mod
          cache-dependency-path: shots-founder-hub-backend/server/go.sum
      - name: Read central-auth Node version
        id: node-version
        run: |
          version=$(cat .node-version 2>/dev/null || sed -n 's/.*>=\([0-9.]*\).*/\1/p' package.json)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - name: Install central-auth dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain
        id: rust-toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          components=$(sed -n 's/^components = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d '" ')
          test -n "$toolchain" && test -n "$components"
          echo "channel=$toolchain" >> "$GITHUB_OUTPUT"
          echo "components=$components" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: ${{ steps.rust-toolchain.outputs.components }}
      - name: Install Rust API system dependency
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install process-compose
        run: go install github.com/f1bonacc1/process-compose@v1.124.0
      - name: Install Shots dependencies
        working-directory: shots-founder-hub-backend/clients
        run: npm ci
      - name: Install the isolated pair
        run: pnpm dev:local setup --profile ci --shots-path ../shots-founder-hub-backend --port 4400
      - name: Install Chromium for authenticated browser tests
        working-directory: shots-founder-hub-backend/clients
        run: npx playwright install --with-deps chromium
      - name: Start isolated pair
        working-directory: shots-founder-hub-central-auth
        run: pnpm dev:local up --profile ci
      - name: Test both repositories
        working-directory: shots-founder-hub-central-auth
        run: pnpm dev:local test --profile ci

  macos-native-settings:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: shots-founder-hub-central-auth
    steps:
      - uses: actions/checkout@v4
        with:
          path: shots-founder-hub-backend
      - uses: actions/checkout@v4
        with:
          repository: PlaybookMediaLLC/shots-founder-hub
          ref: ${{ inputs.counterpart_ref || 'fix/shots-central-auth' }}
          path: shots-founder-hub-central-auth
      - uses: actions/setup-go@v5
        with:
          go-version-file: shots-founder-hub-backend/server/go.mod
          cache-dependency-path: shots-founder-hub-backend/server/go.sum
      - name: Read central-auth Node version
        id: node-version
        run: |
          version=$(cat .node-version 2>/dev/null || sed -n 's/.*>=\([0-9.]*\).*/\1/p' package.json)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - name: Install central-auth dependencies
        run: pnpm install --frozen-lockfile
      - name: Check CrabNebula WebDriver credential
        id: webdriver
        run: |
          if [ -n "$CN_API_KEY_WEBDRIVER" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CN_API_KEY_WEBDRIVER: ${{ secrets.CN_API_KEY_WEBDRIVER }}
      - name: Read central-auth Rust toolchain
        if: steps.webdriver.outputs.available == 'true'
        id: rust-toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          components=$(sed -n 's/^components = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d '" ')
          test -n "$toolchain" && test -n "$components"
          echo "channel=$toolchain" >> "$GITHUB_OUTPUT"
          echo "components=$components" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: steps.webdriver.outputs.available == 'true'
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: aarch64-apple-darwin
          components: ${{ steps.rust-toolchain.outputs.components }}
      - uses: ./shots-founder-hub-central-auth/.github/actions/install_desktop_deps
        if: steps.webdriver.outputs.available == 'true'
        with:
          target: macos
      - name: Build shared UI
        if: steps.webdriver.outputs.available == 'true'
        run: pnpm -F @anlg/ui build
      - name: Build the paired desktop automation binary
        if: steps.webdriver.outputs.available == 'true'
        run: pnpm -F @anlg/desktop tauri build --debug --no-bundle --target aarch64-apple-darwin --config '{"identifier":"com.hyprnote.dev.ci"}' --features dev,devtools,automation
        env:
          CI: 'false'
          POSTHOG_API_KEY: phc_e2e
          VITE_API_URL: http://localhost:4408
          VITE_SHOTS_URL: http://localhost:4401
          VITE_APP_URL: http://localhost:4400
      - name: Run native desktop settings persistence
        if: steps.webdriver.outputs.available == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        id: desktop-e2e
        run: pnpm -F e2e-blackbox exec wdio run wdio.blackbox.conf.ts --spec ./tests/settings.spec.ts
        env:
          APP_BINARY_PATH: ${{ github.workspace }}/shots-founder-hub-central-auth/apps/desktop/src-tauri/target/aarch64-apple-darwin/debug/anarlog-dev
          CN_API_KEY_WEBDRIVER: ${{ secrets.CN_API_KEY_WEBDRIVER }}
        continue-on-error: true
      - name: Explain native E2E skip for fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "Native WebDriver E2E is skipped because fork pull requests do not receive repository secrets."
      - name: Explain native E2E skip without WebDriver credential
        if: steps.webdriver.outputs.available != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: echo "Native WebDriver E2E is skipped because CN_API_KEY_WEBDRIVER is not configured."
      - name: Upload native desktop logs on failure
        if: steps.desktop-e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: founder-hub-native-settings-e2e
          path: |
            shots-founder-hub-central-auth/e2e/blackbox/logs/
            shots-founder-hub-central-auth/e2e/blackbox/videos/
          retention-days: 7
          if-no-files-found: ignore
      - name: Fail on native desktop E2E failure
        if: steps.desktop-e2e.outcome == 'failure'
        run: exit 1
