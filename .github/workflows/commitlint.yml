name: Commitlint

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

# `edited` fires on every pull request description change; one run is enough.
concurrency:
  group: commitlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Check pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        working-directory: clients
        run: |
          # Lint commits authored on the PR's first-parent history. A fork sync
          # intentionally imports upstream commits as a merge's second parent,
          # and those messages are outside this repository's commit convention.
          #
          # Installing the whole 1,500-package monorepo to read commit
          # messages cost about a minute; commitlint and its config are all
          # this needs. The versions match clients/package.json.
          while read -r commit; do
            git show --quiet --format=%B "$commit" |
              npx --yes --package @commitlint/cli@21.2.2 --package @commitlint/config-conventional@21.2.2 \
                -- commitlint --verbose
          done < <(git rev-list --first-parent --reverse "$BASE_SHA..$HEAD_SHA")
