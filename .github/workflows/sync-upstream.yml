name: Sync Upstream

# Nightly fork sync. Fetches KartikLabhshetwar/screenshot-studio, merges its main into the
# long-lived "upstream" branch, and opens a PR from "upstream" to develop when
# the branch carries changes that develop does not have. A human reviews and
# merges the PR, so upstream code reaches production only through a develop -> main release.
# If the merge conflicts, the job fails and a human resolves it on the
# "upstream" branch.
on:
  schedule:
    # 08:00 UTC = midnight PST.
    - cron: '0 8 * * *'
  workflow_dispatch:

# Serialize runs so a manual dispatch cannot race the scheduled push.
concurrency:
  group: sync-upstream
  cancel-in-progress: true

# contents: write pushes the "upstream" branch.
# pull-requests: write opens the sync PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Merge Upstream & Open PR
    runs-on: ubuntu-latest
    steps:
      # NEVER add a step that executes merged code here — no `npm ci`, no
      # repository script, no build. This job holds a write token while a
      # third-party repository's code sits in the worktree, so anything that
      # runs it hands that repository arbitrary code execution against this
      # one. Run checks on the pull request this job opens instead, where CI
      # runs with a read-only token.
      #
      # The token is not persisted in .git/config for the same reason; the
      # push below passes it explicitly, for that one command.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: develop
          # Full history: the merge needs the common ancestor.
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream/main into the upstream branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/KartikLabhshetwar/screenshot-studio.git
          git fetch upstream main
          # Reuse the existing branch, or create it from develop on the first run.
          git checkout upstream || git checkout -b upstream
          git merge --no-edit upstream/main
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" upstream

      - name: Open PR against develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No delta against develop: nothing to open.
          if git diff --quiet origin/develop upstream; then
            echo "upstream branch matches develop; no PR needed."
            exit 0
          fi
          # An open sync PR already tracks the branch; the push above updated it.
          if [ "$(gh pr list --head upstream --base develop --state open --json number --jq length)" != "0" ]; then
            echo "Sync PR already open; branch updated."
            exit 0
          fi
          # REST, not "gh pr create": the GraphQL createPullRequest mutation
          # rejects the Actions token with "Resource not accessible by
          # integration" even with pull-requests: write granted.
          gh api "repos/${GITHUB_REPOSITORY}/pulls" \
            -f base=develop \
            -f head=upstream \
            -f title="chore: sync upstream $(date -u +%F)" \
            -f body="Nightly merge of KartikLabhshetwar/screenshot-studio main into the upstream branch. Review and merge into develop; release through develop to main."
