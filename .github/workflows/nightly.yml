# Two things the pull request path must not pay for, measured once a night on
# develop:
#
# 1. The shard manifest. dev/e2e-plan.mjs packs browser shards by measured
#    duration; without a current manifest it falls back to balancing by file
#    count, which left one measured run's shards at 904 s, 1044 s and 1464 s.
# 2. The quarantine. Flows the production build is known to fail
#    (clients/apps/web/test/e2e/README.md). Running them here keeps the list
#    visible and shrinking without costing a review anything, and a pass means
#    the bug is fixed and the test can rejoin the suite.
name: Nightly

on:
  schedule:
    # After the day's pushes to develop have landed and their runs finished.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.4'

jobs:
  shard-manifest:
    name: Refresh the shard manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download the last successful full run's durations
        id: durations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch develop \
            --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""')"
          if [[ -z "$run" ]]; then
            echo 'No successful full run on develop to measure.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/durations"
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'e2e-durations-*' \
            --dir "$RUNNER_TEMP/durations"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Rewrite test/e2e/durations.json
        if: steps.durations.outputs.run != ''
        working-directory: clients/apps/web
        run: |
          set -euo pipefail
          # The suite lane only: the recovery and onboarding runs measure a
          # different thing and write reports of their own.
          node scripts/e2e-shard-manifest.mjs \
            "$RUNNER_TEMP"/durations/*/results-production.json
      # Pushed and opened with `gh`, the way sync-upstream.yml does it, rather
      # than through another action that would hold a write token.
      - name: Open a pull request when the plan would change
        if: steps.durations.outputs.run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MEASURED_RUN: ${{ steps.durations.outputs.run }}
        run: |
          set -euo pipefail
          manifest=clients/apps/web/test/e2e/durations.json
          if git diff --quiet -- "$manifest"; then
            echo 'The shard manifest is unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B ci/shard-manifest
          git add "$manifest"
          git commit --message 'ci: refresh the browser shard duration manifest'
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" ci/shard-manifest
          if [ "$(gh pr list --head ci/shard-manifest --base develop --state open --json number --jq length)" != '0' ]; then
            echo 'Shard manifest pull request already open; branch updated.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls" \
            -f base=develop -f head=ci/shard-manifest \
            -f title='ci: refresh the browser shard duration manifest' \
            -f body="Measured from run $MEASURED_RUN. dev/e2e-plan.mjs packs browser shards by these durations; letting them go stale falls back to balancing by file count."

  quarantine:
    name: Quarantined browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      E2E_DOCKER_HOST_GATEWAY: 'true'
      E2E_APP_IMAGE_READY: 'true'
      STUDIO_PREBUILT_IMAGES: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clients/package-lock.json
      - run: npm ci --prefer-offline --no-audit
        working-directory: clients
      - name: Install Chromium
        working-directory: clients
        run: npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v3
      # No sibling build jobs to hand images over, so build them here from the
      # same layer caches ci.yml fills. Read-only: a nightly must not reshape
      # the cache a pull request will read.
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: clients/apps/web/Dockerfile
          tags: screenshot-studio-web-e2e:latest
          load: true
          cache-from: type=gha,scope=screenshot-studio-web
      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: server
          tags: screenshot-studio-backend:local
          load: true
          cache-from: type=gha,scope=social-backend
      - name: Build the collab image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: clients/apps/collab-server/Dockerfile
          tags: screenshot-studio-collab:local
          load: true
          cache-from: type=gha,scope=screenshot-studio-collab
      - name: Start the stack with the production app
        run: ./dev/studio up --lane production
      - name: Run the quarantined flows
        id: quarantine
        continue-on-error: true
        run: ./dev/studio e2e-quarantine
      - name: Report which flows the production build still fails
        if: always() && hashFiles('clients/apps/web/playwright-report/results-quarantine.json') != ''
        working-directory: clients/apps/web
        run: |
          node scripts/e2e-durations.mjs playwright-report/results-quarantine.json >> "$GITHUB_STEP_SUMMARY"
          if [[ '${{ steps.quarantine.outcome }}' == 'success' ]]; then
            echo 'Every quarantined flow passed on the production build. Remove the @quarantine tags.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-${{ github.run_id }}
          path: |
            clients/apps/web/playwright-report/
            clients/apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - if: always() && hashFiles('.local/dev.env') != ''
        run: ./dev/studio down --purge --yes
