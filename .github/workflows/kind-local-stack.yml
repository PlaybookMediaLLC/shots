name: Kind local stack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    # Three image builds, a cluster, a Helm install with --wait, two rollouts
    # and the whole browser suite. The old 20-minute budget could not cover
    # the builds alone, and a timed-out job is cancelled, so `if: failure()`
    # never ran and the run produced no diagnostics either.
    timeout-minutes: 60
    env:
      # The three images are built below, with a layer cache.
      STUDIO_PREBUILT_IMAGES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: clients/package-lock.json
      - uses: helm/kind-action@v1.12.0
        with:
          install_only: true
      - run: npm ci --prefer-offline --no-audit
        working-directory: clients
      - name: Install browser test dependencies
        working-directory: clients
        run: npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v3
      # The same layer caches ci.yml fills, read-only: this workflow is manual,
      # so it never refreshes them for anyone else.
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: clients/apps/web/Dockerfile
          tags: screenshot-studio:kind-dev
          load: true
          cache-from: type=gha,scope=screenshot-studio-web
      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: server
          tags: screenshot-studio-backend:kind-dev
          load: true
          cache-from: type=gha,scope=social-backend
      - name: Build the collab image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: clients/apps/collab-server/Dockerfile
          tags: screenshot-studio-collab:kind-dev
          load: true
          cache-from: type=gha,scope=screenshot-studio-collab
      - run: ./dev/studio kind-up
      - name: Smoke test the Helm release
        run: |
          kubectl --namespace screenshot-studio port-forward service/screenshot-studio 3000:80 &
          port_forward_pid=$!
          kubectl --namespace screenshot-studio port-forward service/screenshot-studio-storage 5000:5000 &
          storage_port_forward_pid=$!
          trap 'kill $port_forward_pid $storage_port_forward_pid' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify tenant isolation in Kind
        run: |
          kubectl --namespace screenshot-studio port-forward service/screenshot-studio 3000:80 &
          port_forward_pid=$!
          kubectl --namespace screenshot-studio port-forward service/screenshot-studio-postgres 54329:5432 &
          postgres_port_forward_pid=$!
          kubectl --namespace screenshot-studio port-forward service/screenshot-studio-rustfs 9003:9000 &
          rustfs_port_forward_pid=$!
          # Content draft co-editing: browsers reach the collab server directly.
          kubectl --namespace screenshot-studio port-forward service/screenshot-studio-collab 1234:1234 &
          collab_port_forward_pid=$!
          trap 'kill $port_forward_pid $postgres_port_forward_pid $rustfs_port_forward_pid $collab_port_forward_pid' EXIT
          source .local/dev.env
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:3000/api/health; then
              TENANT_TEST_BASE_URL=http://localhost:3000 npm --prefix clients/apps/web run test:tenant-isolation
              E2E_BASE_URL=http://localhost:3000 \
                E2E_DATABASE_URL=postgresql://screenshot_studio:$POSTGRES_APP_PASSWORD@127.0.0.1:54329/screenshot_studio?schema=public \
                E2E_R2_ENDPOINT=http://127.0.0.1:9003 \
                E2E_MANAGE_SCREENSHOT_MOCK=false \
                make e2e
              exit 0
            fi
            sleep 1
          done
          exit 1
      - if: failure()
        name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kind-playwright-artifacts-${{ github.run_id }}
          path: |
            clients/apps/web/playwright-report/
            clients/apps/web/test-results/
          if-no-files-found: ignore
      - if: always()
        run: ./dev/studio kind-down --yes
