# The browser suite's app (dev/studio run_e2e): the web app as a production
# build (`next start`), as Next.js recommends for browser tests and as
# production serves it. There is no second lane; the few hooks the suite needs
# are asked for here instead of being inferred from NODE_ENV.
services:
  app:
    image: screenshot-studio-web-e2e
    build:
      context: ..
      dockerfile: clients/apps/web/Dockerfile
    command: ['node', 'clients/apps/web/server.js']
    working_dir: /app
    volumes: !reset []
    environment:
      NODE_ENV: production
      # The scripted AI model, downloads from the screenshot mock, and room
      # under Better Auth's sign-in limit. clients/apps/web/lib/e2e-hooks.ts
      # also requires a loopback origin, so this enables nothing anywhere else.
      PLATFORM_E2E_HOOKS: '1'
      # Offers GIF search so its flow can be tested; each spec answers the search
      # itself, so GIPHY is never contacted. test/write-giphy.server.ts covers the gate.
      PLATFORM_GIPHY_APPROVED_API_AND_STORAGE: 'true'
      GIPHY_API_KEY: e2e-fixture
      # Test users have no inbox. Production verifies email by default.
      AUTH_REQUIRE_EMAIL_VERIFICATION: 'false'
      HOSTNAME: 0.0.0.0
      PORT: '3000'
